services:
  - type: web
    name: unebil-backend
    runtime: node
    rootDir: backend
    region: frankfurt
    plan: free
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: AI_PROVIDER
        value: inception
      - key: INCEPTION_MODEL
        value: mercury-2
      - key: INCEPTION_API_KEY
        sync: false  # set manually in Render Dashboard
      - key: NODE_VERSION
        value: 20
